name: TMDC Docker Image CI workflow

on:
  push:
    tags:
      # e.g. 2.45.1-d1, v2.45.1-d1
      - '*-d*'

jobs:
  dev-release:
    name: Build and Push Dex Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup Disk Space
        run: |
          df -h
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          df -h

      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build Docker image
        run: make build-tmdc-docker GITHUB_TAGS=${{ github.ref_name }} PLATFORM=linux/amd64

      - name: Push Docker image
        run: make push-tmdc-docker GITHUB_TAGS=${{ github.ref_name }}
