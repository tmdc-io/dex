name: TMDC Docker Image CI workflow

on:
  push:
    tags:
      # e.g. 2.45.1-d1, v2.45.1-d1
      - '*-d*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish (e.g. 2.45.1-d1)
        required: true
        type: string

jobs:
  dev-release:
    name: Build and Push Dex Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup Disk Space
        run: |
          df -h
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          df -h

      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Docker Hub credentials
        env:
          DOCKER_USER: ${{ secrets.DOCKER_HUB_USERNAME || secrets.DOCKER_USERNAME }}
        run: |
          if [ -z "$DOCKER_USER" ]; then
            echo "::error::Docker Hub credentials are not available to this repository."
            echo "Add repository secrets DOCKER_HUB_USERNAME and DOCKER_HUB_PASSWORD"
            echo "(or DOCKER_USERNAME and DOCKER_PASSWORD) in Settings → Secrets and variables → Actions."
            echo "If these exist as organization secrets, grant tmdc-io/dex access to them."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD || secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: make build-tmdc-docker GITHUB_TAGS=${{ steps.tag.outputs.value }} PLATFORM=linux/amd64

      - name: Push Docker image
        run: make push-tmdc-docker GITHUB_TAGS=${{ steps.tag.outputs.value }}
