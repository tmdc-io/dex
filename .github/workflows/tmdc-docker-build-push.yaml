name: TMDC Docker Image CI workflow

on:
  push:
    tags:
      # e.g. 2.45.1-d1, v2.45.1-d1
      - '*-d*'

jobs:
  dev-release:
    name: Build and Push Dex Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup Disk Space
        run: |
          df -h
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          df -h

      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: make build-tmdc-docker GITHUB_TAGS=${{ github.ref_name }} PLATFORM=linux/amd64

      - name: Push Docker image
        run: make push-tmdc-docker GITHUB_TAGS=${{ github.ref_name }}
